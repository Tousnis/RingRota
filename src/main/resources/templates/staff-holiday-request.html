<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/clock-general-custom.css}">

    <title>Holiday Requests</title>
</head>

<body class="d-flex flex-column vh-100 bg-light">

<!-- header start -->
<header class="py-2 border-bottom border-5 bg-white shadow">
    <div class="d-flex align-items-center justify-content-between px-4">

        <h2 class="m-2" th:text="'Hello, ' + ${loggedName}"></h2>

        <h3>My Holiday Requests</h3>

        <div class="px-5 py-2 " style="border: 2px solid black;">
            <div class="clock"></div>
        </div>

    </div>
</header>
<!--end of header-->


<!-- start of main -->
<main class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

    <!-- start of the sidebar -->
    <aside class="d-flex flex-column flex-shrink-0 p-3 "  style="width: 280px; background: linear-gradient(to right, black 0%, black 97%, white 100%);">

        <h4 style=" color: black" class="p-3 bg-white">RingRota</h4>
        <hr class="border border-white">

        <ul class="nav nav-pills flex-column mb-auto">
             <!-- first link url = staff-shift--->
            <li class="nav-item" ><a th:href="@{/staff-shift}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);" >
                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-shift.gif}" alt="Calendar icon" width="32" height="32">
                </div>

                My Shifts</a>
            </li>

            <li class="nav-item"><a th:href="@{/staff-clock-in-out}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">
                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-clock.gif}" alt="Clock icon" width="32" height="32">
                </div>
                My Clock In/Out</a>
            </li>
            <li class="nav-item"><a aria-current="page" th:href="@{/staff-holiday-request}" class="nav-link active text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">
                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-holiday.gif}" alt="Airplane icon" width="32" height="32">
                </div>
                My Holiday Requests</a>
            </li>
            <li class="nav-item"><a th:href="@{/forum}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">
                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-forum.gif}" alt="Group chat icon" width="32" height="32">
                </div>
                My Forum</a>
            </li>
        </ul>

        <div class="border border-white"></div>
        <hr>

        <div class="dropdown">
            <a href="#"
               class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
               data-bs-toggle="dropdown"
               aria-expanded="false">
                <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle me-2" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-profile.gif}" alt="Profile icon" width="32" height="32">
                </div>
                <strong th:text="${loggedName}"></strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                <li>
                    <a class="dropdown-item" th:href="@{/settings}">
                        Settings
                    </a>
                </li>

                <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item">Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
    </aside>
    <!-- End Sidebar -->

    <!-- page main content -->
    <div class="flex-grow-1 overflow-auto">
        <div class="container py-4">

            <div class="card border-0 bg-white shadow">
                <div class="card-body">

                    <h5 class="mb-3 border-bottom pb-2 text-center">Request Holiday</h5>

                    <form th:action="@{/staff-holiday-request-save}" method="post">

                        <div th:if="${holidayRequested}" class="alert alert-success" role="alert" th:text="${holidayRequested}"></div>
                        <div th:if="${holidayError}" class="alert alert-danger" role="alert" th:text="${holidayError}"></div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select id="holidayFrom" name="holidayFrom" class="form-select" required>
                                        <option value="">Choose a shift</option>
                                        <option th:each="shift : ${myShifts}" th:value="${shift.shiftDate}"
                                                th:text="${#temporals.format(shift.shiftDate,'EEE dd MMM yyyy')} + ', ' + ${#temporals.format(shift.shiftStarts,'HH:mm')} + ' - ' + ${#temporals.format(shift.shiftEnds,'HH:mm')}"></option>
                                    </select>
                                    <label for="holidayFrom">From</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select id="holidayTo" name="holidayTo" class="form-select" required>
                                        <option value="">Choose a shift</option>
                                        <option th:each="shift : ${myShifts}" th:value="${shift.shiftDate}"
                                                th:text="${#temporals.format(shift.shiftDate,'EEE dd MMM yyyy')} + ', ' + ${#temporals.format(shift.shiftStarts,'HH:mm')} + ' - ' + ${#temporals.format(shift.shiftEnds,'HH:mm')}"></option>
                                    </select>
                                    <label for="holidayTo">To</label>
                                </div>
                            </div>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn text-white px-4" style="background-color: black;">Request</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 bg-white shadow mt-4">
                <div class="card-body">

                    <h5 class="mb-3 border-bottom pb-2 text-center">My Holiday Requests</h5>
                    <div class="table-responsive">
                        <table class="table table-striped-columns table-bordered table-hover">
                            <thead>
                            <tr>
                                <th scope="col">Request</th>
                                <th scope="col">From</th>
                                <th scope="col">To</th>
                                <th scope="col">Status</th>
                            </tr>
                            </thead>
                            <tbody class="table-group-divider">
                            <tr th:each="holiday, holidayStat : ${myHolidays}">
                                <td th:text="${holidayStat.count}"></td>
                                <td th:text="${#temporals.format(holiday.holidayFrom,'dd MMM yyyy')}"></td>
                                <td th:text="${#temporals.format(holiday.holidayTo,'dd MMM yyyy')}"></td>
                                <td th:text="${holiday.status}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- End Page Content -->
</main>
<!-- End Main -->

<!--start of footer -->
<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026. &copy;</p>
</footer>
<!-- End Footer -->

<script th:src="@{/js/clock-custom.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>




</body>
</html>
