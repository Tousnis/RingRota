<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/clock-general-custom.css}">

    <title>Holiday Requests</title>
</head>

<body class="d-flex flex-column vh-100 bg-light">

<!-- Header -->

<header class="py-2 border-bottom border-5 bg-white shadow">
    <div class="d-flex align-items-center justify-content-between px-4">

        <h2 class="m-2" th:text="'Hello, ' + ${loggedName}"></h2>

        <h3>Holiday Requests</h3>

        <div class="px-5 py-2 " style="border: 2px solid #000000;">
            <div class="clock"></div>
        </div>

    </div>
</header>
<!--end of header-->


<!-- start of main -->
<main class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

    <!-- Admin sidebar -->
    <aside class="d-flex flex-column flex-shrink-0 p-3 "  style="width: 280px; background: linear-gradient(to right, black 0%, black 97%, white 100%);">

        <h4 style=" color: black" class="p-3 bg-white">RingRota</h4>
        <hr class="border border-white">

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a th:href="@{/admin/staff-management}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">

                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/admin-staff-management.gif}" alt="Staff management icon" width="32" height="32">
                </div>
                Staff management</a>

            </li>

            <li class="nav-item" ><a th:href="@{/admin/rota-management}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);" >

                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-shift.gif}" alt="Calendar icon" width="32" height="32">
                </div>
                Rota management</a>

            </li>

            <li class="nav-item"><a th:href="@{/admin/staff-clock-management}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">

                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-clock.gif}" alt="Clock icon" width="32" height="32">
                </div>
                Clock In/Out management</a>

            </li>

            <li class="nav-item"><a th:href="@{/admin/staff-holiday-request}" aria-current="page" class="nav-link active text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">

                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-holiday.gif}" alt="Airplane icon" width="32" height="32">
                </div>
                Holiday Request management</a>
            </li>
            <li class="nav-item"><a th:href="@{/forum}" class="nav-link text-white icon-link icon-link-hover text-decoration-underline p-2" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);">

                <div class="bi d-inline-flex align-items-center justify-content-center bg-white rounded-circle" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-forum.gif}" alt="Group chat icon" width="32" height="32">
                </div>
                Forum</a>
            </li>

        </ul>

        <div class="border border-white"></div>
        <hr>

        <div class="dropdown">
            <a href="#"
               class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
               data-bs-toggle="dropdown"
               aria-expanded="false">
                <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle me-2" style="width: 36px; height: 36px;">
                    <img th:src="@{/img/staff-profile.gif}" alt="Profile icon" width="32" height="32">
                </div>
                <strong th:text="${loggedName}"></strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                <li>
                    <a class="dropdown-item" th:href="@{/settings}">
                        Settings
                    </a>
                </li>

                <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item">Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
    </aside>

    <!-- End Sidebar -->
    <!-- page main content -->
    <div class="flex-grow-1 overflow-auto">
        <div class="container py-4">

            <div class="card border-0 bg-white shadow">
                <div class="card-body">

                    <h5 class="mb-3 border-bottom pb-2 text-center">Holiday Requests</h5>
                    <div th:if="${holidayApproved}" class="alert alert-success" role="alert" th:text="${holidayApproved}"></div>
                    <div th:if="${holidayRejected}" class="alert alert-danger" role="alert" th:text="${holidayRejected}"></div>
                    <div class="table-responsive">
                        <table class="table table-striped-columns table-bordered table-hover">
                            <thead>
                            <tr>
                                <th scope="col">Request</th>
                                <th scope="col">Staff</th>
                                <th scope="col">From</th>
                                <th scope="col">To</th>
                                <th scope="col">Status</th>
                                <th scope="col">Action</th>
                            </tr>
                            </thead>
                            <tbody class="table-group-divider">
                            <tr th:each="holiday, holidayStat : ${allHolidays}">
                                <td th:text="${holidayStat.count}"></td>
                                <td th:text="${holiday.staffName}"></td>
                                <td th:text="${#temporals.format(holiday.holidayFrom,'dd MMM yyyy')}"></td>
                                <td th:text="${#temporals.format(holiday.holidayTo,'dd MMM yyyy')}"></td>
                                <td th:text="${holiday.status}"></td>
                                <td>
                                    <div th:if="${holiday.status == 'PENDING'}" class="d-flex gap-2">
                                        <form class="m-0" th:action="@{/admin/staff-holiday-approve/{id}(id=${holiday.holidayId})}" method="post">
                                            <button type="submit" class="btn text-white" style="background-color: black;">Approve</button>
                                        </form>
                                        <form class="m-0" th:action="@{/admin/staff-holiday-reject/{id}(id=${holiday.holidayId})}" method="post">
                                            <button type="submit" class="btn btn-danger">Reject</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- End Page Content -->
</main>
<!-- End Main -->

<!--start of footer -->
<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026. &copy;</p>
</footer>

<!-- End Footer -->
<script th:src="@{/js/clock-custom.js}"></script>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
