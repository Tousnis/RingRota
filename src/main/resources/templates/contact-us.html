<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <title>Contact us</title>
</head>

<body class="d-flex flex-column vh-100 bg-light">

<!-- Header -->
<header class="py-3 text-center border-bottom border-5 bg-white shadow">
    <h3>Contact us</h3>
</header>
<!--end of header-->


<!-- start of main -->
<main class="flex-grow-1 overflow-auto">
    <div class="container py-5">

        <a class="icon-link icon-link-hover mb-4" style="--bs-link-hover-color-rgb: 25, 135, 84; color: black" th:href="@{/}">
            Return
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
            </svg>
        </a>

        <div class="card border-0 bg-white shadow mx-auto mt-3" style="max-width: 700px;">
            <div class="card-body p-4">
                <h1 class="mb-3 text-center">Contact us</h1>


                <form action="mailto:stu140281@ardenuniversity.ac.uk" method="post" enctype="text/plain">

                    <div class="mb-3 form-floating">
                        <input type="text" id="name" name="name" class="form-control" placeholder="Name" required>
                        <label for="name">Name</label>
                    </div>

                    <div class="mb-3 form-floating">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
                        <label for="email">Email</label>
                    </div>

                    <div class="mb-3 form-floating">
                        <textarea id="message" name="message" class="form-control" placeholder="Message" style="height: 150px;" required></textarea>
                        <label for="message">Message</label>
                    </div>

                    <button type="submit" class="btn text-white w-100" style="background-color: black">Send</button>
                </form>
            </div>
        </div>

    </div>
</main>
<!-- End Main -->

<!-- Footer -->
<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026. &copy;</p>
</footer>
<!-- End Footer -->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
