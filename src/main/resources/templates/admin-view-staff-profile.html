<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <title>Staff Profile</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">


<header class="py-3 text-center border-bottom border-5 bg-white shadow">
    <h3>Staff Profile</h3>
</header>


<main class="flex-grow-1">

    <a class="icon-link icon-link-hover  ms-3 mt-2  " style="--bs-link-hover-color-rgb: 25, 135, 84; color: black" th:href="@{/admin/staff-management}">
        Return

        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
        </svg>
    </a>



    <div class="container py-4">
        <div class="card border-0 bg-white shadow w-50 mx-auto mt-3">
            <div class="card-body py-3">
                <div class="text-center mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                    </svg>
                </div>
                <h5 class="mb-3  pb-2 text-center">
                    Staff Details
                </h5>
                <div style="background-color: black">
                    <hr>
                </div>
                <div class="mb-3">
                    <strong>Staff ID</strong>
                    <p class="mb-0" th:text="${staff.staffId}"></p>
                </div>
                <div class="mb-3">
                    <strong>Name</strong>
                    <p class="mb-0" th:text="${staff.name}"></p>
                </div>
                <div class="mb-3">
                    <strong>Last Name</strong>
                    <p class="mb-0" th:text="${staff.lastName}"></p>
                </div>
                <div class="mb-3">
                    <strong>Email</strong>
                    <p class="mb-0" th:text="${staff.email}"></p>
                </div>
                <div class="mb-3">
                    <strong>Phone Number</strong>
                    <p class="mb-0" th:text="${staff.phoneNumber}"></p>
                </div>
                <div class="mb-3">
                    <strong>Role</strong>
                    <p class="mb-0" th:text="${staff.role}"></p>
                </div>
                <div class="mb-4">
                    <strong>Total Hours</strong>
                    <p class="mb-0" th:text="${staff.totalHours}"></p>
                </div>

                <div class="actions d-flex gap-2">
                    <a class="btn text-white flex-fill" style="background-color: black;" th:href="@{/admin/find-staff-for-edit/{id}(id=${staff.staffId})}">Edit</a>

                    <form class="flex-fill m-0" th:action="@{/admin/delete-staff/{id}(id=${staff.staffId})}" method="post">

                        <button type="submit" class="btn text-white w-100 btn-danger">Delete</button>

                    </form>

                </div>
                <p class=" mt-1 mb-0">Staff members with shifts or clock records can't be deleted.</p>

            </div>

        </div>

    </div>

</main>


<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026.</p>
</footer>


</body>
</html>
