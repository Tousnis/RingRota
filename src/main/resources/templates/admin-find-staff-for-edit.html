<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <title>Edit Staff</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">



<header class="py-3 text-center border-bottom border-5 bg-white shadow">
    <h3>Editing staff member.</h3>
</header>



<main class="flex-grow-1">

    <a class="icon-link icon-link-hover  ms-3 mt-2  " style="--bs-link-hover-color-rgb: 25, 135, 84; color: black" th:href="@{/admin/view-staff-profile/{id}(id=${editStaff.staffId})}"> <!--Note-->
        Return

        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
        </svg>
    </a>

    <div class="container py-4">
        <div class="card border-0 bg-white shadow w-50 mx-auto mt-3">
            <div class="card-body py-3">
                <h5 class="mb-3 border-bottom pb-2 text-center">Edit Staff</h5>
                <h6>Reminders for admin.</h6>
                <p>Contact support for changing staff's email.</p>
                <form th:action="@{/admin/save-staff-edit/{id}(id=${editStaff.staffId})}" th:object="${editStaff}" method="post">  <!--sending the data to POST /admin/save-staff-edit/{id} = dto editStaff -->

                    <div th:if="${memberChanged}" class="alert alert-success" role="alert" th:text="${memberChanged}"></div> <!--One time message-->

                    <div class="mb-3 form-floating">
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Tousni">
                        <label for="name">First Name</label>
                        <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></small>
                    </div>
                    <div class="mb-3 form-floating">
                        <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="e.g. Jabbi">
                        <label for="lastName">Last Name</label>
                        <small th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></small>
                    </div>


                    <div class="mb-3 form-floating">
                        <input type="number" id="phone-number" th:field="*{phoneNumber}" class="form-control" placeholder="23892382984">
                        <label for="phone-number">Phone number</label>
                        <small th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-danger"></small>
                    </div>


                    <div class="mb-3 form-floating">
                        <input type="number"
                               id="totalHours"
                               th:field="*{totalHours}"
                               class="form-control" placeholder="0">
                        <label for="totalHours">Total hours</label>
                        <small th:if="${#fields.hasErrors('totalHours')}" th:errors="*{totalHours}" class="text-danger"></small>
                    </div>
                    <div class="mb-3 form-floating">
                        <select id="role"
                                th:field="*{role}"
                                class="form-select">
                            <option value="STAFF">Staff</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                        <label for="role">Role</label>
                    </div>
                    <button type="submit" class="btn text-white w-100"  style="background-color: black">
                        Save Changes
                    </button>
                </form>

            </div>

        </div>

    </div>

</main>


<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026.</p>
</footer>

</body>
</html>
