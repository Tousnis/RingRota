<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <title>Log in - RingRota</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Header (same as the other pages) -->
<header class="py-2 border-bottom border-5 bg-white shadow">
    <div class="d-flex align-items-center justify-content-between px-4">

    </div>
</header>
<!--end of header-->


<!-- start of main: login page (no sidebar, nobody is logged in yet) -->
<main class="flex-grow-1">

    <!-- Return to the home page -->
    <a class="icon-link icon-link-hover ms-3 mt-2" style="--bs-link-hover-color-rgb: 25, 135, 84; color: black" th:href="@{/}">
        Return
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16" aria-hidden="true">
            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
        </svg>
    </a>

    <div class="container py-4">
        <!-- App name, big, above the login form (this is now the page's main heading, h1) -->
        <h1 class="display-3 fw-bold text-center mt-4">RingRota</h1>

        <div class="card border-0 bg-white shadow w-50 mx-auto mt-3">
            <div class="card-body py-3">
                <h2 class="h5 mb-3 border-bottom pb-2 text-center">Login</h2> <!--h2 now: only one h1 per page-->

                <!-- Spring Security handles POST /login itself (no controller method needed) -->
                <!-- th:action adds the hidden CSRF token automatically -->
                <form th:action="@{/login}" method="post">

                    <!-- Shown when the login fails (/login?error): same message for wrong email or wrong password -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">Wrong email or password.</div>

                    <!-- name="username": Spring's name for this box; in RingRota the username is the email -->
                    <div class="mb-3 form-floating">
                        <input type="email" id="username" name="username" class="form-control" placeholder="name@ringrota.com" autocomplete="username" required>
                        <label for="username">Email</label>
                    </div>

                    <div class="mb-3 form-floating">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        <label for="password">Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" style="background-color: black">Log in</button>

                </form>
            </div>
        </div>
    </div>
</main>
<!-- End Main -->

<!-- Footer (same as the other pages) -->
<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026. &copy;</p>
</footer>
<!-- End Footer -->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
