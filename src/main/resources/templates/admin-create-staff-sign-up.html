<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<title>Sign Up</title>


</head>
<body class="d-flex flex-column min-vh-100 bg-light"> <!--Body background light-->

<div class="container">
<header class="py-3 text-center border-bottom border-3 bg-white shadow-sm">

    <h3>Creating a new staff member.</h3>

</header>
</div>

<main class="flex-grow-1">


    <a class="icon-link icon-link-hover  ms-3 mt-2  " style="--bs-link-hover-color-rgb: 25, 135, 84; color: black" th:href="@{/admin/staff-management}">
        Return
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
        </svg>
    </a>

<div class="container py-4">
    <div class="card  border-0 bg-white shadow w-50 mx-auto mt-3">
        <div class="card-body py-3">
            <h5 class=" mb-3  border-bottom pb-2 text-center">Staff details</h5>

    <form th:action="@{/admin/save-staff-sign-up}" th:object="${signUpForm}" method="post"> <!--Goes to post method = /admin/save-staff-sign-up -->
        <!--Personal notes-->
        <!--Dto object signUpform, sending to controller -->

        <div th:if="${memberCreated}" class="alert alert-success" role="alert" th:text="${memberCreated}"></div> <!--One time message-->

        <div class="mb-3 form-floating"> <!--margin bottom size-->
            <input type="text" id="name" th:field="*{name}" class="form-control " placeholder="e.g. Tousni">
            <label for="name" >First Name</label>
            <small  th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></small>

        </div>

        <div class="mb-3 form-floating">
            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="e.g. Jabbi">
            <label for="lastName">Last Name</label>
            <small th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <div class="input-group">
                <div class="form-floating">
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Email">
                    <label for="email">Email</label>
                </div>
                <div class="input-group-text">@ringrota.com</div>
            </div>
            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></small>
        </div>

        <div class="mb-3 form-floating">
            <input type="number" id="phone-number" th:field="*{phoneNumber}" class="form-control" placeholder="23892382984">
            <label for="phone-number">Phone number</label>
            <small th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-danger"></small>
        </div>

        <div class="mb-3 form-floating">
            <input type="password" id="password" th:field="*{password}" class="form-control form-control-sm" placeholder="••••••••">
            <label for="password">Password</label>
            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></small>
        </div>

        <div class="form-floating mb-3">
            <select id="role" class="form-select" th:field="*{role}">
                <option value="STAFF">Staff</option>
                <option value="ADMIN">Admin</option>
            </select>
            <label for="role">Role</label>
            <small th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-danger"></small>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="background-color: black">Create Account</button>

    </form>
        </div>
    </div>
</div>
</main>
<div class="container">
<footer class="py-3 text-center border-top border-2 bg-white shadow"> <!--padding top + botton, size of the padding-->
    <p>Created by Tousni 2026. &copy;</p>
</footer>
    </div>

</body>
</html>
