<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <title>Settings</title>
</head>

<body class="d-flex flex-column vh-100 bg-light">


<header class="py-3 text-center border-bottom border-5 bg-white shadow">
    <h3>Settings</h3>
</header>


<main class="flex-grow-1 overflow-auto">

    <a class="icon-link icon-link-hover  ms-3 mt-2  " style="--bs-link-hover-color-rgb: 25, 135, 84; color: black" th:href="@{/home}">
        Return

        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
        </svg>
    </a>

    <div class="container py-4">
        <div class="card border-0 bg-white shadow w-50 mx-auto mt-3">
            <div class="card-body py-3">
                <h5 class="mb-3 border-bottom pb-2 text-center">Change Password</h5>

                <form th:action="@{/save-new-password}" method="post">

                    <div th:if="${passwordChanged}" class="alert alert-success" role="alert" th:text="${passwordChanged}"></div>
                    <div th:if="${passwordError}" class="alert alert-danger" role="alert" th:text="${passwordError}"></div>

                    <div class="mb-3 form-floating">
                        <input type="password" id="currentPassword" name="currentPassword" class="form-control" placeholder="Current password" autocomplete="current-password" required>
                        <label for="currentPassword">Current password</label>
                    </div>

                    <div class="mb-3 form-floating">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="New password" autocomplete="new-password" required>
                        <label for="newPassword">New password</label>
                    </div>

                    <div class="mb-3 form-floating">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm new password" autocomplete="new-password" required>
                        <label for="confirmPassword">Confirm new password</label>
                    </div>

                    <button type="submit" class="btn text-white w-100" style="background-color: black;">Save</button>
                </form>
            </div>
        </div>
    </div>

</main>


<footer class="py-3 text-center border-top border-5 bg-white shadow">
    <p>Created by Tousni 2026. &copy;</p>
</footer>


</body>
</html>
